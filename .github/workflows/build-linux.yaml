name: "Build (Linux)"
permissions:
  contents: read
  artifact-metadata: read

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      artifact-metadata: write
    steps:
      - name: OS setup
        run: |
          sudo apt-get -y remove --autoremove --purge apache2 firefox powershell ubuntu-pro-client
          sudo apt-get -y update
          sudo apt-get -y upgrade
      - name: Checkout build scripts
        uses: actions/checkout@v7
      - name: Read build.env
        id: buildenv
        uses: falti/dotenv-action@f4656c46de6bc223dda660f6724d52537bc0642a # v1.1.5
        with:
          path: build.env
          export-variables: true
          keys-case: upper
          log-variables: true
      - name: Install build deps
        run: |
          sudo apt-get -y install build-essential emacs-bin-common check
          sudo apt-get -y install libzstd-dev libssl-dev libtls-dev
      - name: Setup build environment
        run: |
          CUSTOM_LIBDIR="${GITHUB_WORKSPACE}/static_libs"
          mkdir -vp "${CUSTOM_LIBDIR}"
          echo "CUSTOM_LIBDIR=${CUSTOM_LIBDIR}" >> "${GITHUB_ENV}"
      - name: Checkout libfixposix
        uses: actions/checkout@v7
        with:
          repository: sionescu/libfixposix
          ref: "v${{env.LIBFIXPOSIX_VERSION}}"
          path: libfixposix
      - name: Build libfixposix
        run: scripts/build_libfixposix.sh "${{env.CUSTOM_LIBDIR}}"
      - name: Fetch SBCL host
        run: scripts/fetch_sbcl_host.sh "${{env.SBCL_HOST_VERSION}}"
      - name: Checkout SBCL
        uses: actions/checkout@v7
        with:
          repository: sbcl/sbcl
          ref: "sbcl-${{env.SBCL_VERSION}}"
          path: sbcl
      - name: Patch SBCL
        run: cd sbcl && patch -p1 -i ../sbcl-customizations.patch
      - name: Build SBCL
        run: scripts/build_sbcl.sh "${{env.SBCL_HOST}}" "${{env.SBCL_VERSION}}" "${{env.ASDF_VERSION}}" "${{env.REVISION}}" "${{env.CUSTOM_LIBDIR}}"
      - name: Export build.env
        run: |
          SBCL_VERSION=${{steps.buildenv.outputs.sbcl_version}}
          ASDF_VERSION=${{steps.buildenv.outputs.asdf_version}}
          LIBFIXPOSIX_VERSION=${{steps.buildenv.outputs.libfixposix_version}}
          OPENSSL_VERSION=$(dpkg-query -W -f='${VERSION}' libssl-dev)
          LIBTLS_VERSION=$(dpkg-query -W -f='${VERSION}' libtls-dev)
          cat > linux-notes.md << EOF
          # Components:
          - SBCL ${SBCL_VERSION}
          - ASDF ${ASDF_VERSION}
          - libfixposix ${LIBFIXPOSIX_VERSION}
          - OpenSSL ${OPENSSL_VERSION}
          - LibTLS ${LIBTLS_VERSION}
          EOF

      - name: 'Upload Artifacts'
        uses: actions/upload-artifact@v7
        with:
          name: linux-tarballs
          path: |
            ${{env.SRCDIST}}
            ${{env.BINDIST}}
            linux-notes.md
          retention-days: 5
